[project]
name = "trustworthy-rag-backend"
version = "0.1.0"
description = "FastAPI backend for a trustworthy domain-specific RAG chatbot with provenance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.23",
    "fastapi>=0.115.6",
    "httpx>=0.27.2",
    "markdown>=3.7",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.20",
    "sentence-transformers>=3.3.1",
    "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
